<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPATISAN CALON LURAH ABRORI</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e8f5e9; /* Hijau muda lembut */
            margin: 0;
            padding: 10px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 128, 0, 0.15);
            border-top: 5px solid #2e7d32;
        }
        h2 {
            text-align: center;
            font-size: 1.3rem;
            color: #2e7d32; /* Hijau tua */
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .status {
            text-align: center;
            font-size: 0.8rem;
            color: #388e3c;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .rt-select {
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            font-size: 0.95rem;
            color: #1b5e20;
        }
        select {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            font-size: 1rem;
            border: 2px solid #a5d6a7;
            border-radius: 6px;
            background-color: #f1f8e9;
            color: #1b5e20;
            font-weight: bold;
        }
        select:focus {
            outline: none;
            border-color: #2e7d32;
        }
        .input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        input {
            flex: 1;
            padding: 11px;
            font-size: 1rem;
            border: 1px solid #c8e6c9;
            border-radius: 6px;
            background-color: #fafafa;
        }
        input:focus {
            outline: none;
            border-color: #4caf50;
            background-color: #fff;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>SIMPATISAN CALON LURAH ABRORI</h2>
    <div class="status" id="connection-status">Status: Menghubungkan...</div>

    <div class="rt-select">
        <label for="rtSelect">PILIH RT:</label>
        <select id="rtSelect" onchange="gantiRT()">
            <option value="RT 01">RT 01</option>
            <option value="RT 02">RT 02</option>
            <option value="RT 03">RT 03</option>
            <option value="RT 04">RT 04</option>
            <option value="RT 05">RT 05</option>
            <option value="RT 06">RT 06</option>
            <option value="RT 07">RT 07</option>
            <option value="RT 08">RT 08</option>
            <option value="RT 09">RT 09</option>
        </select>
    </div>

    <div id="form-container">
        <!-- Kolom input dinamis -->
    </div>
</div>

<script>
    // Konfigurasi Firebase
    const firebaseConfig = {
        databaseURL: "https://pilkades-fed6d-default-rtdb.firebaseio.com/"
    };
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // Cek koneksi
    db.ref(".info/connected").on("value", function(snap) {
        if (snap.val() === true) {
            document.getElementById("connection-status").innerText = "Status: Online (Terhubung)";
        } else {
            document.getElementById("connection-status").innerText = "Status: Offline";
        }
    });

    let currentRT = "RT 01";
    let databaseData = {};
    let isLocalTyping = false;

    function gantiRT() {
        currentRT = document.getElementById("rtSelect").value;
        renderForm();
    }

    db.ref("simpatisan").on("value", (snapshot) => {
        if (!isLocalTyping) {
            databaseData = snapshot.val() || {};
            renderForm();
        }
    });

    function renderForm() {
        const container = document.getElementById("form-container");
        const dataRT = databaseData[currentRT] || {};
        
        let maxIndex = -1;
        const keys = Object.keys(dataRT);
        keys.forEach(k => {
            let idx = parseInt(k.replace('row_', ''));
            if (idx > maxIndex) maxIndex = idx;
        });

        // Minimal 5 baris awal, jika baris terakhir terisi otomatis tambah baris baru
        let totalRows = Math.max(5, maxIndex + 1);
        if (maxIndex >= 0 && dataRT[`row_${maxIndex}`] && dataRT[`row_${maxIndex}`].trim() !== "") {
            totalRows = maxIndex + 2;
        }

        const activeElementId = document.activeElement ? document.activeElement.id : null;

        let html = "";
        for (let i = 0; i < totalRows; i++) {
            let val = dataRT[`row_${i}`] || "";
            html += `<div class="input-row">
                        <input type="text" id="row_${i}" placeholder="Nama Warga Simpatisan ${i+1}" value="${val}" oninput="simpanData(${i}, this.value)">
                     </div>`;
        }
        container.innerHTML = html;

        if (activeElementId && document.getElementById(activeElementId)) {
            const el = document.getElementById(activeElementId);
            el.focus();
            const v = el.value;
            el.value = '';
            el.value = v;
        }
    }

    function simpanData(index, value) {
        isLocalTyping = true;
        
        if (!databaseData[currentRT]) databaseData[currentRT] = {};
        databaseData[currentRT][`row_${index}`] = value;

        db.ref(`simpatisan/${currentRT}/row_${index}`).set(value).then(() => {
            setTimeout(() => { isLocalTyping = false; }, 300);
        });

        const container = document.getElementById("form-container");
        const rows = container.getElementsByClassName("input-row");
        if (index === rows.length - 1 && value.trim() !== "") {
            const newIndex = rows.length;
            const newRow = document.createElement("div");
            newRow.className = "input-row";
            newRow.innerHTML = `<input type="text" id="row_${newIndex}" placeholder="Nama Warga Simpatisan ${newIndex+1}" value="" oninput="simpanData(${newIndex}, this.value)">`;
            container.appendChild(newRow);
        }
    }
</script>

</body>
</html>
