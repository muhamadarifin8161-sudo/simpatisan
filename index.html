<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPATISAN CALON LURAH ABRORI</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            color: #111;
        }
        .header {
            background-color: #0d5c38;
            color: white;
            padding: 18px 15px;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
        }
        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            max-width: 650px;
            margin: 0 auto;
        }
        .header-text {
            flex: 1;
            text-align: left;
        }
        .header h1 {
            font-size: 1.15rem;
            margin: 0 0 6px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.3;
        }
        .header p {
            font-size: 0.8rem;
            margin: 0 0 10px 0;
            opacity: 0.95;
            line-height: 1.2;
        }
        .header-photo-container {
            flex-shrink: 0;
            background: white;
            border-radius: 12px;
            padding: 2px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.25);
        }
        .candidate-photo {
            width: 75px;
            height: 90px;
            border-radius: 10px;
            object-fit: cover;
            object-position: top center;
            display: block;
        }
        .status-badge {
            display: inline-block;
            background-color: #dc3545;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .status-badge.online {
            background-color: #198754;
        }
        .container {
            max-width: 650px;
            margin: 15px auto;
            padding: 0 10px;
        }
        .dashboard-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .panel-box {
            background: white;
            border-radius: 10px;
            padding: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }
        .panel-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 8px;
            text-align: center;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 6px;
        }
        .rt-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }
        .rt-btn {
            background: white;
            border: 2px solid #cbd5e1;
            padding: 10px 2px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            color: #1e293b;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .rt-btn.active {
            background-color: #0d5c38;
            color: white;
            border-color: #0d5c38;
        }
        .summary-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 0.9rem;
        }
        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 10px;
            border-bottom: 1px dashed #e2e8f0;
            color: #334155;
        }
        .summary-item:last-child {
            border-bottom: none;
        }
        .summary-total {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 2px solid #cbd5e1;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: #064e3b;
            font-size: 0.95rem;
        }
        .card {
            background: white;
            border-radius: 10px;
            padding: 18px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }
        .action-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .btn-summary {
            flex: 1;
            background-color: #0d5c38;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 2px 4px rgba(13, 92, 56, 0.2);
        }
        .search-box-container {
            margin-bottom: 15px;
        }
        .search-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.9rem;
            box-sizing: border-box;
            background-color: #f8fafc;
        }
        .search-input:focus {
            outline: none;
            border-color: #0d5c38;
            background-color: #fff;
            box-shadow: 0 0 0 2px rgba(13, 92, 56, 0.15);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background-color: #1e293b;
            color: white;
            font-size: 0.85rem;
            padding: 12px 10px;
            text-align: left;
            letter-spacing: 0.5px;
        }
        th:first-child { width: 45px; text-align: center; border-top-left-radius: 6px; }
        th:last-child { width: 55px; text-align: center; border-top-right-radius: 6px; }
        td {
            padding: 10px 8px;
            border-bottom: 1px solid #cbd5e1;
        }
        tbody tr:nth-child(odd) {
            background-color: #f8fafc;
        }
        td:first-child {
            text-align: center;
            font-weight: bold;
            color: #334155;
            font-size: 0.95rem;
        }
        .name-input {
            width: 100%;
            border: 1px solid transparent;
            background: transparent;
            font-size: 1.05rem;
            font-weight: 500;
            padding: 8px;
            color: #0f172a;
            border-radius: 4px;
        }
        .name-input:focus {
            outline: none;
            background-color: #ffffff;
            border-color: #0d5c38;
            box-shadow: 0 0 0 2px rgba(13, 92, 56, 0.15);
        }
        .btn-delete {
            background: none;
            border: none;
            color: #dc3545;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 5px;
        }

        /* Style untuk Popup Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
        }
        .modal-content {
            background: white;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            animation: modalPop 0.2s ease-in-out;
        }
        @keyframes modalPop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }
        .modal-title {
            font-size: 1rem;
            font-weight: bold;
            color: #1e293b;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #64748b;
            font-weight: bold;
        }
        .modal-footer {
            margin-top: 15px;
            text-align: right;
        }
        .btn-close-modal {
            background-color: #334155;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-content">
        <div class="header-text">
            <h1>Simpatisan Calon Lurah Abrori</h1>
            <p>Pendataan Pendukung & Simpatisan<br>(RT. 01 s.d. RT. 09)</p>
            <div class="status-badge" id="connection-status">Menghubungkan...</div>
        </div>
        <div class="header-photo-container">
            <img src="foto_abrori.jpg" alt="Abrori" class="candidate-photo">
        </div>
    </div>
</div>

<div class="container">
    <div class="dashboard-layout">
        <div class="panel-box">
            <div class="panel-title">PILIH RT</div>
            <div class="rt-grid" id="rtGrid">
                <button class="rt-btn active" onclick="pilihRT('RT 01')">RT. 01</button>
                <button class="rt-btn" onclick="pilihRT('RT 02')">RT. 02</button>
                <button class="rt-btn" onclick="pilihRT('RT 03')">RT. 03</button>
                <button class="rt-btn" onclick="pilihRT('RT 04')">RT. 04</button>
                <button class="rt-btn" onclick="pilihRT('RT 05')">RT. 05</button>
                <button class="rt-btn" onclick="pilihRT('RT 06')">RT. 06</button>
                <button class="rt-btn" onclick="pilihRT('RT 07')">RT. 07</button>
                <button class="rt-btn" onclick="pilihRT('RT 08')">RT. 08</button>
                <button class="rt-btn" onclick="pilihRT('RT 09')">RT. 09</button>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="action-bar">
            <!-- Tombol Ringkasan Rekap Saja -->
            <button class="btn-summary" onclick="bukaModalRingkasan()">📊 Ringkasan Rekap</button>
        </div>

        <!-- Kolom Pencarian Global -->
        <div class="search-box-container">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Cari nama simpatisan..." oninput="cariSimpatisan(this.value)">
        </div>

        <table>
            <thead>
                <tr>
                    <th>NO</th>
                    <th id="tableHeaderTitle">NAMA LENGKAP SIMPATISAN (RT. 01)</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
    </div>
</div>

<!-- Elemen Popup Modal Ringkasan Rekap -->
<div class="modal-overlay" id="modalRingkasan">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title">RINGKASAN REKAP SIMPATISAN</div>
            <button class="modal-close" onclick="tutupModalRingkasan()">✕</button>
        </div>
        <ul class="summary-list" id="summaryList"></ul>
        <div class="summary-total" id="summaryTotal">
            <span>Total Keseluruhan</span>
            <span>0 orang</span>
        </div>
        <div class="modal-footer">
            <button class="btn-close-modal" onclick="tutupModalRingkasan()">Tutup</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        databaseURL: "https://pilkades-fed6d-default-rtdb.firebaseio.com/"
    };
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    const statusBadge = document.getElementById("connection-status");
    db.ref(".info/connected").on("value", function(snap) {
        if (snap.val() === true) {
            statusBadge.innerText = "Online (Terhubung)";
            statusBadge.classList.add("online");
        } else {
            statusBadge.innerText = "Offline";
            statusBadge.classList.remove("online");
        }
    });

    let currentRT = "RT 01";
    let databaseData = {};
    let isLocalTyping = false;
    let manualExtraRows = {}; 
    let keywordPencarian = "";

    function pilihRT(rt) {
        currentRT = rt;
        keywordPencarian = "";
        document.getElementById("searchInput").value = "";
        
        const buttons = document.querySelectorAll('.rt-btn');
        buttons.forEach(btn => {
            if (btn.innerText.includes(rt.replace(' ', ''))) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        document.getElementById("tableHeaderTitle").innerText = `NAMA LENGKAP SIMPATISAN (${rt.replace(' ', '. ')})`;
        renderTable();
    }

    db.ref("/").on("value", (snapshot) => {
        databaseData = snapshot.val() || {};
        if (!isLocalTyping) {
            renderTable();
        }
        updateSummary();
    });

    function getDbKey() {
        let num = parseInt(currentRT.replace('RT ', ''), 10);
        return "rt_" + num;
    }

    function updateSummary() {
        let summaryData = [];
        let grandTotal = 0;

        for (let i = 1; i <= 9; i++) {
            let key = `rt_${i}`;
            let dataRT = databaseData[key] || {};
            let count = 0;
            Object.keys(dataRT).forEach(k => {
                if (dataRT[k] && typeof dataRT[k] === 'string' && dataRT[k].trim() !== "") count++;
            });
            summaryData.push({ rt: `RT. 0${i}`.replace('RT. 010', 'RT. 10'), count: count, key: key });
            grandTotal += count;
        }

        // Urutkan berdasarkan abjad RT agar susunannya stabil (RT. 01 sampai RT. 09)
        summaryData.sort((a, b) => a.rt.localeCompare(b.rt));

        let html = "";
        summaryData.forEach(item => {
            html += `<li class="summary-item" style="cursor: pointer;" onclick="pilihRT dariRekap('${item.key}')" title="Klik untuk lihat data">
                        <span>${item.rt}</span>
                        <span><b>${item.count}</b> orang</span>
                     </li>`;
        });

        document.getElementById("summaryList").innerHTML = html;
        document.getElementById("summaryTotal").innerHTML = `<span>Total Keseluruhan</span><span><b>${grandTotal}</b> orang</span>`;
    }

    // Fungsi tambahan agar saat baris rekap diklik, langsung membuka RT tersebut
    function pilihRT dariRekap(dbKey) {
        let num = dbKey.replace('rt_', '');
        let formatted = "RT " + (num.length === 1 ? "0" + num : num);
        tutupModalRingkasan();
        pilihRT(formatted);
    }

    function cariSimpatisan(keyword) {
        keywordPencarian = keyword.toLowerCase().trim();
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById("tableBody");
        const dbKey = getDbKey();
        const dataRT = databaseData[dbKey] || {};
        
        let maxIndex = -1;
        Object.keys(dataRT).forEach(k => {
            let idx = parseInt(k.replace('row_', ''), 10);
            if (!isNaN(idx) && idx > maxIndex) maxIndex = idx;
        });

        let extra = manualExtraRows[currentRT] || 0;
        let totalRows = Math.max(5, maxIndex + 2 + extra);

        const activeId = document.activeElement ? document.activeElement.id : null;
        const activeSelStart = document.activeElement && document.activeElement.selectionStart !== undefined ? document.activeElement.selectionStart : null;

        let html = "";
        let displayedCount = 0;

        for (let i = 0; i < totalRows; i++) {
            let val = dataRT[`row_${i}`] || "";
            
            if (keywordPencarian !== "" && val.toLowerCase().indexOf(keywordPencarian) === -1 && val.trim() !== "") {
                continue; 
            }

            displayedCount++;
            html += `<tr>
                        <td>${displayedCount}</td>
                        <td>
                            <input type="text" class="name-input" id="row_${i}" placeholder="Ketik nama simpatisan" value="${val}" oninput="simpanData(${i}, this.value)" onkeydown="handleKeyDown(event, ${i})" onfocus="isLocalTyping=true" onblur="isLocalTyping=false">
                        </td>
                        <td style="text-align: center;">
                            <button class="btn-delete" onclick="hapusBaris(${i})" title="Hapus">🗑️</button>
                        </td>
                     </tr>`;
        }
        
        if (displayedCount === 0 && keywordPencarian !== "") {
            html = `<tr><td colspan="3" style="text-align:center; color:#64748b; padding:15px;">Nama "${keywordPencarian}" tidak ditemukan di ${currentRT}.</td></tr>`;
        }

        tbody.innerHTML = html;

        if (activeId && document.getElementById(activeId)) {
            const el = document.getElementById(activeId);
            el.focus();
            if (activeSelStart !== null) {
                try { el.setSelectionRange(activeSelStart, activeSelStart); } catch(e) {}
            }
        }
    }

    function handleKeyDown(event, index) {
        if (event.key === 'Enter') {
            event.preventDefault();
            const nextInput = document.getElementById(`row_${index + 1}`);
            if (nextInput) {
                nextInput.focus();
            } else {
                if (!manualExtraRows[currentRT]) manualExtraRows[currentRT] = 0;
                manualExtraRows[currentRT]++;
                isLocalTyping = false;
                renderTable();
                setTimeout(() => {
                    const newNextInput = document.getElementById(`row_${index + 1}`);
                    if (newNextInput) newNextInput.focus();
                }, 50);
            }
        }
    }

    function simpanData(index, value) {
        isLocalTyping = true;
        const dbKey = getDbKey();

        if (!databaseData[dbKey]) databaseData[dbKey] = {};
        databaseData[dbKey][`row_${index}`] = value;

        db.ref(`${dbKey}/row_${index}`).set(value);

        updateSummary();

        const tbody = document.getElementById("tableBody");
        if (index >= tbody.rows.length - 2 && value.trim() !== "") {
            if (!manualExtraRows[currentRT]) manualExtraRows[currentRT] = 0;
            manualExtraRows[currentRT]++;
            setTimeout(() => renderTable(), 50);
        }
    }

    function hapusBaris(index) {
        if (!confirm(`Hapus data baris nomor ${index + 1}?`)) return;

        isLocalTyping = false;
        const dbKey = getDbKey();
        if (databaseData[dbKey]) {
            let dataRT = databaseData[dbKey];
            delete dataRT[`row_${index}`];
            
            let newObj = {};
            let newIdx = 0;
            let keys = Object.keys(dataRT).filter(k => k.startsWith('row_')).sort((a,b) => {
                return parseInt(a.replace('row_', ''), 10) - parseInt(b.replace('row_', ''), 10);
            });

            keys.forEach(k => {
                if (dataRT[k] && dataRT[k].trim() !== "") {
                    newObj[`row_${newIdx}`] = dataRT[k];
                    newIdx++;
                }
            });

            databaseData[dbKey] = newObj;
            db.ref(`${dbKey}`).set(newObj).then(() => {
                if (manualExtraRows[currentRT]) manualExtraRows[currentRT] = 0;
                renderTable();
                updateSummary();
            });
        }
    }

    function bukaModalRingkasan() {
        document.getElementById("modalRingkasan").style.display = "flex";
    }

    function tutupModalRingkasan() {
        document.getElementById("modalRingkasan").style.display = "none";
    }

    window.onclick = function(event) {
        const modal = document.getElementById("modalRingkasan");
        if (event.target === modal) {
            modal.style.display = "none";
        }
    }
</script>

</body>
</html>
