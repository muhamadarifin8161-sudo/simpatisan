<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendataan Simpatisan Calon Lurah Abrori</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 10px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            font-size: 1.2rem;
            color: #0d6efd;
            margin-bottom: 15px;
        }
        .rt-select {
            margin-bottom: 15px;
        }
        label {
            font-weight: bold;
            font-size: 0.9rem;
        }
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        input {
            flex: 1;
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .status {
            text-align: center;
            font-size: 0.8rem;
            color: green;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Simpatisan Lurah Abrori</h2>
    <div class="status" id="connection-status">Menghubungkan ke database...</div>

    <div class="rt-select">
        <label for="rtSelect">Pilih RT:</label>
        <select id="rtSelect" onchange="gantiRT()">
            <option value="RT 01">RT 01</option>
            <option value="RT 02">RT 02</option>
            <option value="RT 03">RT 03</option>
            <option value="RT 04">RT 04</option>
            <option value="RT 05">RT 05</option>
            <option value="RT 06">RT 06</option>
            <option value="RT 07">RT 07</option>
            <option value="RT 08">RT 08</option>
            <option value="RT 09">RT 09</option>
        </select>
    </div>

    <div id="form-container">
        <!-- Kolom input akan digenerate secara dinamis di sini -->
    </div>
</div>

<script>
    // Konfigurasi Firebase Anda
    const firebaseConfig = {
        databaseURL: "https://pilkades-fed6d-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Cek koneksi
    db.ref(".info/connected").on("value", function(snap) {
        if (snap.val() === true) {
            document.getElementById("connection-status").innerText = "Status: Online (Terhubung)";
        } else {
            document.getElementById("connection-status").innerText = "Status: Offline";
        }
    });

    let currentRT = "RT 01";
    let databaseData = {};
    let isLocalTyping = false; // Mencegah keyboard lompat akibat sinkronisasi berlebih

    function gantiRT() {
        currentRT = document.getElementById("rtSelect").value;
        renderForm();
    }

    // Ambil data dari Firebase secara real-time sekali di awal/perubahan besar
    db.ref("simpatisan").on("value", (snapshot) => {
        if (!isLocalTyping) {
            databaseData = snapshot.val() || {};
            renderForm();
        }
    });

    function renderForm() {
        const container = document.getElementById("form-container");
        const dataRT = databaseData[currentRT] || {};
        
        // Cari jumlah baris terisi, minimal tampilkan 5 baris awal
        let maxIndex = 0;
        const keys = Object.keys(dataRT);
        keys.forEach(k => {
            let idx = parseInt(k.replace('row_', ''));
            if (idx > maxIndex) maxIndex = idx;
        });

        let totalRows = Math.max(5, maxIndex + 1); 
        // Jika baris terakhir sudah terisi, tambahkan 1 kolom kosong di bawahnya secara otomatis
        if (dataRT[`row_${maxIndex}`] && dataRT[`row_${maxIndex}`].trim() !== "") {
            totalRows = maxIndex + 2;
        }

        // Simpan fokus elemen yang sedang diketik agar kursor tidak mental
        const activeElementId = document.activeElement ? document.activeElement.id : null;

        let html = "";
        for (let i = 0; i < totalRows; i++) {
            let val = dataRT[`row_${i}`] || "";
            html += `<div class="input-row">
                        <input type="text" id="row_${i}" placeholder="Nama Simpatisan ${i+1}" value="${val}" oninput="simpanData(${i}, this.value)">
                     </div>`;
        }
        container.innerHTML = html;

        // Kembalikan fokus kursor ke kolom semula agar keyboard HP tidak tertutup/turun naik
        if (activeElementId && document.getElementById(activeElementId)) {
            const el = document.getElementById(activeElementId);
            el.focus();
            // Pindahkan kursor ke ujung teks
            const v = el.value;
            el.value = '';
            el.value = v;
        }
    }

    function simpanData(index, value) {
        isLocalTyping = true; // Tandai sedang mengetik lokal
        
        // Simpan langsung ke state lokal dulu agar responsif
        if (!databaseData[currentRT]) databaseData[currentRT] = {};
        databaseData[currentRT][`row_${index}`] = value;

        // Kirim ke Firebase dengan debounce / langsung
        db.ref(`simpatisan/${currentRT}/row_${index}`).set(value).then(() => {
            setTimeout(() => { isLocalTyping = false; }, 300);
        });

        // Cek secara dinamis apakah baris terakhir sudah mulai diisi untuk memunculkan baris baru di bawahnya tanpa mereset seluruh halaman
        const container = document.getElementById("form-container");
        const rows = container.getElementsByClassName("input-row");
        if (index === rows.length - 1 && value.trim() !== "") {
            // Tambah baris baru secara instan di DOM tanpa render ulang total
            const newIndex = rows.length;
            const newRow = document.createElement("div");
            newRow.className = "input-row";
            newRow.innerHTML = `<input type="text" id="row_${newIndex}" placeholder="Nama Simpatisan ${newIndex+1}" value="" oninput="simpanData(${newIndex}, this.value)">`;
            container.appendChild(newRow);
        }
    }
</script>

</body>
</html>
